<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>明德國中 701 班費管理系統</title>
    <meta name="theme-color" content="#247a72" />
    <meta name="application-name" content="701 班費管理" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="701 班費" />
    <link rel="manifest" href="./dist/manifest.webmanifest" />
    <link rel="icon" href="./dist/pwa-icon.svg" type="image/svg+xml" />
    <meta http-equiv="refresh" content="0; url=./dist/index.html#/login" />
    <script>
      (function () {
        try {
          var base = document.querySelector('link[rel="icon"]')
            ? (function () {
                var a = document.createElement("a");
                a.href = "./dist/";
                return a.href;
              })()
            : "./dist/";
          var target = base + "index.html#/login";
          window.location.replace(target);
        } catch (e) {
          setTimeout(function () {
            window.location.href = "./dist/index.html#/login";
          }, 150);
        }
      })();
    </script>
    <style>
      html, body { margin:0;padding:0; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
        background:#f5f8f6; color:#1f3a37; min-height:100vh; display:grid; place-items:center;
      }
      .wrap { max-width:520px; padding:28px 24px; text-align:center; }
      .logo {
        width:72px;height:72px;border-radius:22px;background:#247a72;color:#f8fffc;
        display:grid;place-items:center;font-size:28px;font-weight:900;margin:0 auto 18px;
        box-shadow:0 14px 28px rgba(36,122,114,.28);
      }
      h1 { margin:0 0 10px; font-size:26px; letter-spacing:-.04em; }
      p { margin:0 0 18px; color:#6a7c78; font-size:14px; line-height:1.6; }
      .cta {
        display:inline-block;padding:13px 20px;border-radius:14px;background:#247a72;color:#fff;
        text-decoration:none;font-weight:800;font-size:14px;box-shadow:0 8px 16px rgba(36,122,114,.22);
      }
      .tip { margin-top:22px; color:#8b9c98; font-size:12px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo">7</div>
      <h1>明德國中 701 班費管理系統</h1>
      <p>正在跳轉至登入頁，請稍候…若瀏覽器未自動跳轉，請點擊下方按鈕。</p>
      <a class="cta" href="./dist/index.html#/login">前往登入頁</a>
      <p class="tip">
        提示：本系統使用「雜湊路由」(#/login / #/students …)，因此可直接部署至 GitHub Pages 子目錄。
        <br />建議部署方式：將 Repo → Settings → Pages → Branch 設為 <strong>/ (root)</strong> 即可。
      </p>
    </div>
  </body>
</html>
