<body class="bg-[#F5F7F4] text-gray-800 min-h-screen flex flex-col">

  <header id="app-header" class="sticky top-0 z-40 bg-[#2E7D32] text-white shadow-md flex-shrink-0">
    <div class="px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i data-lucide="wallet" class="w-6 h-6 text-[#FFF59D]"></i>
        <h1 class="text-lg font-bold tracking-wide">班費管理系統</h1>
      </div>
      <div class="flex items-center gap-3">
        <span id="user-role-badge" class="hidden px-2 py-0.5 text-xs rounded-full bg-white/20 border border-white/30">訪客</span>
        <button id="btn-login-header" class="p-2 rounded-full hover:bg-white/10 active:bg-white/20 transition">
          <i data-lucide="log-in" class="w-5 h-5"></i>
        </button>
        <button id="btn-menu" class="p-2 rounded-full hover:bg-white/10 active:bg-white/20 transition md:hidden">
          <i data-lucide="menu" class="w-5 h-5"></i>
        </button>
      </div>
    </div>
    <div id="header-subtitle" class="px-4 pb-2 text-xs text-white/80 flex items-center justify-between">
      <span id="header-class-name">—</span>
      <span id="header-balance-short">餘額：—</span>
    </div>
  </header>

  <main id="app-main" class="flex-1 overflow-y-auto pb-24 px-4 pt-4 max-w-2xl mx-auto w-full">

    <section id="page-overview" class="page-section">
      <div class="grid grid-cols-3 gap-3 mb-4">
        <div class="bg-white rounded-xl p-3 shadow-sm border border-green-100 text-center">
          <p class="text-xs text-gray-500 mb-1 flex items-center justify-center gap-1">
            <i data-lucide="piggy-bank" class="w-3.5 h-3.5 text-[#2E7D32]"></i>目前餘額
          </p>
          <p id="stat-balance" class="text-lg font-bold text-[#2E7D32]">—</p>
        </div>
        <div class="bg-white rounded-xl p-3 shadow-sm border border-green-100 text-center">
          <p class="text-xs text-gray-500 mb-1 flex items-center justify-center gap-1">
            <i data-lucide="trending-up" class="w-3.5 h-3.5 text-green-600"></i>總收入
          </p>
          <p id="stat-income" class="text-lg font-bold text-green-600">—</p>
        </div>
        <div class="bg-white rounded-xl p-3 shadow-sm border border-green-100 text-center">
          <p class="text-xs text-gray-500 mb-1 flex items-center justify-center gap-1">
            <i data-lucide="trending-down" class="w-3.5 h-3.5 text-red-500"></i>總支出
          </p>
          <p id="stat-expense" class="text-lg font-bold text-red-500">—</p>
        </div>
      </div>

      <div class="bg-[#FFF59D]/40 border border-[#FFF59D] rounded-xl p-3 mb-4 flex items-start gap-3">

          </div>
          <div>
            <label class="text-xs text-gray-600 font-medium mb-1 block">密碼</label>

          </div>
          <div class="flex gap-2">
            <button id="btn-email-login" class="flex-1 py-2.5 rounded-lg bg-[#2E7D32] text-white text-sm font-medium hover:bg-[#256528] transition">登入</button>

  <div id="modal-add-record" class="modal-overlay hidden fixed inset-0 z-50 bg-black/50 flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="modal-content bg-white w-full sm:max-w-md sm:rounded-2xl rounded-t-2xl max-h-[90vh] overflow-y-auto animate-slide-up">
      <div class="p-5">
        <div class="flex items-center justify-between mb-5">
          <h3 id="record-modal-title" class="text-lg font-bold text-gray-800 flex items-center gap-2">
            <i data-lucide="plus-circle" class="w-5 h-5 text-[#2E7D32]"></i>新增收支紀錄

            <i data-lucide="x" class="w-5 h-5 text-gray-500"></i>

        <form id="record-form" class="space-y-4">
          <input type="hidden" id="record-id" />

          <div class="grid grid-cols-2 gap-2 p-1 bg-gray-100 rounded-lg">
            <label class="relative cursor-pointer">
              <input type="radio" name="record-type" value="expense" class="peer sr-only" />
              <div class="py-2.5 text-sm font-medium text-center rounded-md transition peer-checked:bg-white peer-checked:text-red-500 peer-checked:shadow-sm text-gray-500">

            <label class="relative cursor-pointer">
              <input type="radio" name="record-type" value="income" class="peer sr-only" checked />
              <div class="py-2.5 text-sm font-medium text-center rounded-md transition peer-checked:bg-white peer-checked:text-green-600 peer-checked:shadow-sm text-gray-500">
                <i data-lucide="trending-up" class="w-4 h-4 inline mr-1"></i>收入

            </label>
          </div>

          <div>
            <label class="text-xs text-gray-600 font-medium mb-1 block">金額 (NT$)</label>
            <input id="record-amount" type="number" min="1" step="1" placeholder="例如：500" required
              class="w-full px-3 py-2.5 rounded-lg border border-gray-200 text-base font-semibold focus:border-[#2E7D32] focus:ring-1 focus:ring-[#2E7D32] outline-none transition" />
          </div>

          <div>
            <label class="text-xs text-gray-600 font-medium mb-1 block">分類</label>
            <select id="record-category" required
              class="w-full px-3 py-2.5 rounded-lg border border-gray-200 text-sm bg-white focus:border-[#2E7D32] focus:ring-1 focus:ring-[#2E7D32] outline-none transition">
              <option value="">請選擇分類</option>
              <optgroup label="收入">
                <option value="班費收繳">班費收繳</option>
                <option value="捐款">捐款</option>
                <option value="活動收入">活動收入</option>
                <option value="其他收入">其他收入</option>
              </optgroup>
              <optgroup label="支出">
                <option value="活動費用">活動費用</option>
                <option value="書籍用品">書籍用品</option>
                <option value="點心餐飲">點心餐飲</option>
                <option value="交通費">交通費</option>
                <option value="禮物獎品">禮物獎品</option>
                <option value="其他支出">其他支出</option>
              </optgroup>
            </select>
          </div>

          <div>
            <label class="text-xs text-gray-600 font-medium mb-1 block">日期</label>
            <input id="record-date" type="date" required
              class="w-full px-3 py-2.5 rounded-lg border border-gray-200 text-sm focus:border-[#2E7D32] focus:ring-1 focus:ring-[#2E7D32] outline-none transition" />
          </div>

          <div>
            <label class="text-xs text-gray-600 font-medium mb-1 block">備註 <span class="text-gray-400">(選填)</span></label>
            <textarea id="record-note" rows="2" placeholder="例如：秋季出遊便當費"
              class="w-full px-3 py-2.5 rounded-lg border border-gray-200 text-sm focus:border-[#2E7D32] focus:ring-1 focus:ring-[#2E7D32] outline-none transition resize-none"></textarea>
          </div>

          <div class="flex gap-2 pt-2">
            <button type="button" class="modal-close flex-1 py-2.5 rounded-lg bg-gray-100 text-gray-700 text-sm font-medium hover:bg-gray-200 transition" data-modal="modal-add-record">取消</button>
            <button id="record-delete-btn" type="button" class="hidden px-4 py-2.5 rounded-lg bg-red-50 text-red-600 text-sm font-medium border border-red-200 hover:bg-red-100 transition">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
            <button type="submit" class="flex-1 py-2.5 rounded-lg bg-[#2E7D32] text-white text-sm font-medium hover:bg-[#256528] transition flex items-center justify-center gap-1">
              <i data-lucide="save" class="w-4 h-4"></i>儲存
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
