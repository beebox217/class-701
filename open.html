<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#247a72" />
    <title>班費公開頁 · 班費管理</title>
    <meta name="description" content="班費公開頁：結餘、收支明細與繳費進度一次看。" />
    <meta property="og:title" content="班費公開頁 · 班費管理" />
    <meta property="og:description" content="班費結餘、收支明細與繳費進度，免登入即可查看。" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./pwa-icon.svg" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="./pwa-icon.svg" />
    <link rel="icon" type="image/svg+xml" href="./pwa-icon.svg" />
    <link rel="apple-touch-icon" href="./pwa-icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./assets/index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <script>
      function classLogo(w,h){var w = w||28,h = h||28,s = `<img src="./pwa-icon.svg" alt="LOGO" style="width:100%;height:100%;object-fit:contain;display:block;border-radius:inherit"/>`;return s;}
    </script>
    <style>
      :root {
        --teal:#247a72; --teal-2:#3a9b8f; --coral:#e77862; --ink:#1f3a37; --muted:#6a7c78; --line:#e3ece7;
        --paper:#f5f8f5; --card:#ffffff; --soft:#eaf3ef; --sage:#e2f0e9; --rose:#fdece7;
      }
      * { box-sizing: border-box; }
      html, body { margin:0; padding:0; background:var(--paper); color:var(--ink); font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif; }
      a { color: inherit; }
      .public-shell {
        max-width: 620px; margin: 0 auto; padding: 26px 22px 86px; min-height: 100vh;
      }
      .public-top {
        display:flex; align-items:center; gap:14px; margin: 2px 0 18px;
      }
      .brand-mark {
        width:56px; height:56px; border-radius: 18px;
        background: linear-gradient(160deg, #2b8b82, #20655d);
        color:#f8fffc; display:grid; place-items:center;
        box-shadow: 0 12px 28px rgba(36,122,114,.28);
      }
      .brand-copy p.eyebrow { margin:0 0 4px; font-size:12px; letter-spacing:.22em; color:#708681; font-weight:800; }
      .brand-copy h1 { margin:0; font-size:26px; letter-spacing:-.03em; }
      .public-badge {
        display:inline-flex; align-items:center; gap:8px; padding:7px 12px; border-radius:999px;
        background:var(--sage); color:var(--teal); font-size:12.5px; font-weight:800;
        margin-top:8px;
      }
      .welcome-card {
        position:relative; overflow:hidden; border-radius:26px; padding:22px 22px;
        background: linear-gradient(160deg, #2b8b82 0%, #247a72 55%, #1f6d66 100%);
        color:#f8fffc; box-shadow:0 18px 38px rgba(36,122,114,.28); margin: 8px 0 16px;
      }
      .welcome-card .soft-label { display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; background:rgba(255,255,255,.14); color:#e6fff8; font-size:12px; font-weight:700; backdrop-filter: blur(6px); }
      .welcome-card h3 { margin:10px 0 0; font-size:26px; letter-spacing:-.04em; }
      .metric-grid { display:grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr; grid-auto-flow: column; gap:8px; margin-bottom:12px; }
      .metric-card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:10px 10px 9px; box-shadow:0 6px 14px rgba(20,60,40,.05); overflow:hidden; min-width:0; }
      .metric-card.accent { background: linear-gradient(180deg, #e9f5ef, #ffffff 70%); border-color:#dcece3; }
      .metric-card span { color:var(--muted); font-size:10.5px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block; }
      .metric-card strong { display:block; font-size:17px; letter-spacing:-.03em; margin:3px 0 4px; overflow:hidden; text-overflow:ellipsis; }
      .metric-card small { display:inline-flex; align-items:center; gap:4px; color:var(--muted); font-weight:700; font-size:10.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .metric-card small.positive { color:#247a72; } .metric-card small.negative { color:var(--coral); }
      .section-row { display:flex; align-items:center; justify-content:space-between; margin:14px 2px 10px; }
      .section-row h3 { margin:0; font-size:19px; letter-spacing:-.02em; }
      .text-link { color:var(--teal); font-weight:800; font-size:14px; text-decoration:none; display:inline-flex; align-items:center; gap:2px; }
      .transaction-list { display:flex; flex-direction:column; gap:10px; }
      .transaction-row {
        display:grid; grid-template-columns: 52px 1fr auto; align-items:center; gap:12px;
        background:var(--card); border:1px solid var(--line); border-radius:20px; padding:14px;
      }
      .tx-icon {
        width:48px; height:48px; border-radius:16px; display:grid; place-items:center;
      }
      .tx-icon.in { background:#e2f0e9; color:var(--teal); }
      .tx-icon.out { background:#fdece7; color:var(--coral); }
      .tx-copy strong { display:block; font-size:16px; letter-spacing:-.01em; }
      .tx-copy span { color:var(--muted); font-size:13px; line-height:1.45; font-weight:700; }
      .amount { font-weight:900; font-size:17px; letter-spacing:-.01em; }
      .amount.in { color:var(--teal); } .amount.out { color:var(--coral); }
      .empty-state { background:var(--card); border:1px dashed #cfe0d7; color:var(--muted); padding:26px 20px; border-radius:20px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:8px; }
      .empty-state strong { color:var(--ink); font-size:16px; }
      .progress-card { background:var(--card); border:1px solid var(--line); border-radius:22px; padding:18px 18px 16px; margin-top:10px; box-shadow:0 8px 18px rgba(20,60,40,.05); }
      .progress-top { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:12px; }
      .progress-top strong { display:block; font-size:17px; letter-spacing:-.02em; }
      .progress-top span { color:var(--muted); font-size:13px; line-height:1.55; font-weight:700; }
      .progress-top b { font-size:22px; letter-spacing:-.02em; color:var(--teal); }
      .progress-bar { height:10px; border-radius:999px; background:#eaf3ef; overflow:hidden; }
      .progress-bar i { display:block; height:100%; background: linear-gradient(90deg, #3a9b8f, #247a72); border-radius:999px; transition: width .4s ease; }
      .progress-card p { margin:12px 0 0; color:var(--muted); font-size:13px; line-height:1.55; font-weight:700; display:flex; align-items:center; gap:6px; }
      .footer-note { margin-top:28px; display:flex; justify-content:space-between; color:#708681; font-weight:700; font-size:12.5px; }
      .footer-note .status-dot { display:inline-flex; align-items:center; gap:8px; }
      .footer-note .status-dot i { width:8px; height:8px; border-radius:50%; background:#247a72; box-shadow:0 0 0 4px rgba(36,122,114,.18); }
      @media (max-width: 520px) {
        .welcome-card { padding: 18px 18px; }
        .welcome-card h3 { font-size: 22px; }
        .metric-grid { grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr; gap: 6px; }
        .metric-card { padding: 8px 8px 7px; }
        .metric-card span { font-size: 9.5px; }
        .metric-card strong { font-size: 14.5px; margin: 2px 0 3px; }
        .metric-card small { font-size: 9.5px; }
      }
    </style>
  </head>
  <body>
    <div class="public-shell" id="root"></div>
    <script>
      (function () {
        function decodeBundle(qs) {
          try {
            const url = new URL(String(window.location.href));
            const d = url.searchParams.get("d") || "";
            if (!d) return null;
            const clean = d.replace(/-/g, "+").replace(/_/g, "/");
            const pad = "=".repeat((4 - (clean.length % 4)) % 4);
            const binary = atob(clean + pad);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
            const json = new TextDecoder("utf-8").decode(bytes);
            const data = JSON.parse(json);
            return data && Number(data.v) === 1 ? data : null;
          } catch (err) {
            return null;
          }
        }
        function fmt(v) { return Number(v || 0).toLocaleString(); }
        function arrowUp() { return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg>'; }
        function arrowDown() { return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7 7 17"/><path d="M17 17H7V7"/></svg>'; }
        function sparkles() { return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4"/><path d="M12 17v4"/><path d="M3 12h4"/><path d="M17 12h4"/><path d="m5.6 5.6 2.8 2.8"/><path d="m15.6 15.6 2.8 2.8"/><path d="m5.6 18.4 2.8-2.8"/><path d="m15.6 8.4 2.8-2.8"/></svg>'; }
        function renderEmpty(title, desc) {
          return `<div class="empty-state"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1-2-1-2 1-2-1Z"/><path d="M16 8H8"/><path d="M16 12H8"/><path d="M10 16H8"/></svg><strong>${title}</strong><span>${desc}</span></div>`;
        }
        function render(data) {
          const root = document.getElementById("root");
          if (!data) {
            document.title = "連結無效 · 班費公開頁";
            root.innerHTML = `
              <div class="public-top" style="margin-top:6px">
                <div class="brand-mark">${classLogo(26,26)}</div>
                <div class="brand-copy"><p class="eyebrow">CLASS FUND SYSTEM</p><h1>班費公開頁</h1></div>
              </div>
              <section class="welcome-card"><div><span class="soft-label">${sparkles()} 無法讀取分享資料</span><h3>連結已失效或格式錯誤</h3></div></section>
              ${renderEmpty("目前沒有可顯示的資料", "請由系統內重新建立分享連結後再開啟。")}`;
            return;
          }
          const s = data.summary || {};
          const txs = Array.isArray(data.transactions) ? data.transactions : [];
          const recent = txs.slice(0, 10);
          const txRows = recent.length ? recent.map((t) => {
            const cls = String(t.type) === "in" ? "in" : "out";
            const sign = String(t.type) === "in" ? "+" : "−";
            const amt = Math.abs(Number(t.amount) || 0);
            const icon = cls === "in"
              ? '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7 7 17"/><path d="M17 17H7V7"/></svg>'
              : '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg>';
            return `<div class="transaction-row"><div class="tx-icon ${cls}">${icon}</div><div class="tx-copy"><strong>${String(t.title || "").replace(/</g, "&lt;")}</strong><span>${String(t.meta || "").replace(/</g, "&lt;") || (new Date(t.createdAt || Date.now()).toLocaleDateString("zh-Hant"))}</span></div><strong class="amount ${cls}">${sign}${fmt(amt)}</strong></div>`;
          }).join("") : renderEmpty("尚無收支紀錄", "這個班級目前還沒有任何收支明細。");
          const payments = Array.isArray(data.payments) ? data.payments : [];
          let progressHTML = "";
          if (payments.length) {
            progressHTML = `<div class="section-row upcoming-heading"><h3>繳費進度</h3></div>` +
              payments.map((p) => {
                const sc = Number(p.studentCount) || 0;
                const pc = Number(p.paidCount) || 0;
                const rate = sc ? Math.min(100, Math.round((pc / sc) * 100)) : 0;
                const paid = pc * (Number(p.amount) || 0);
                const text = sc
                  ? `${sc} 位學生 · 每位 NT$ ${fmt(p.amount)}`
                  : "尚無學生資料";
                const desc = sc
                  ? `${pc} 位已完成繳費（NT$ ${fmt(paid)}），還有 ${Math.max(sc - pc, 0)} 位待處理`
                  : "尚無學生資料";
                return `<div class="progress-card"><div class="progress-top"><div><strong>${String(p.title).replace(/</g, "&lt;")}</strong><span>${text}</span></div><b>${rate}%</b></div><div class="progress-bar"><i style="width:${rate}%"></i></div><p><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> ${desc}</p></div>`;
              }).join("");
          }
          const generatedAt = data.generatedAt ? new Date(data.generatedAt).toLocaleString("zh-Hant") : "";
          document.title = `${data.className || "701 班"} 班費公開頁`;
          root.innerHTML = `
            <div class="public-top">
              <div class="brand-mark">${classLogo(26,26)}</div>
              <div class="brand-copy"><p class="eyebrow">CLASS FUND SYSTEM</p><h1>${data.className || "701 班"} 班費管理</h1></div>
            </div>
            <p class="eyebrow" style="margin:4px 4px 0;color:#708681;font-weight:800;font-size:12.5px;letter-spacing:.14em">${data.yearLabel || "2026 學年度"} · ${data.className || "701 班"} · <span style="color:var(--teal)">公開唯讀</span></p>
            <section class="welcome-card"><div><span class="soft-label">${sparkles()} 班費摘要</span><h3>班費公開頁面</h3></div></section>
            <section class="metric-grid">
              <div class="metric-card accent"><span>目前結餘</span><strong>NT$ ${fmt(s.balance)}</strong><small>${arrowUp()} 公開資料</small></div>
              <div class="metric-card"><span>累計收入</span><strong>NT$ ${fmt(s.income)}</strong><small class="positive">${arrowUp()} ${Number(s.incomeCount || 0)} 筆收入</small></div>
              <div class="metric-card"><span>累計支出</span><strong>NT$ ${fmt(s.expense)}</strong><small class="negative">${arrowDown()} ${Number(s.expenseCount || 0)} 筆支出</small></div>
            </section>
            <div class="section-row"><h3>收支明細（最近 ${recent.length} 筆）</h3><span class="text-link">共 ${txs.length} 筆</span></div>
            <div class="transaction-list">${txRows}</div>
            ${progressHTML}
            <div class="footer-note"><span>${data.className || "701 班"} 班級自治會</span><span class="status-dot"><i></i>唯讀模式${generatedAt ? " · " + generatedAt : ""}</span></div>
          `;
        }
        try {
          const data = decodeBundle(location.search);
          render(data);
        } catch (e) {
          render(null);
        }
      })();
    </script>
  </body>
</html>
