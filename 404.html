<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>頁面不存在 · 明德國中 701 班費管理系統</title>
    <script>
      (function () {
        function go() {
          var loc = window.location;
          var target = loc.pathname.replace(/\/[^\/]*$/, "/") + "#/login";
          try {
            loc.replace(target);
          } catch (_) {
            loc.href = target;
          }
        }
        go();
        setTimeout(go, 200);
      })();
    </script>
  </head>
  <body style="margin:0;padding:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,'PingFang TC','Microsoft JhengHei',sans-serif;background:#f5f8f6;color:#1f3a37;min-height:100vh;display:grid;place-items:center">
    <div style="max-width:520px;padding:28px 24px;text-align:center">
      <div style="width:72px;height:72px;border-radius:22px;background:#247a72;color:#f8fffc;display:grid;place-items:center;font-size:28px;font-weight:900;margin:0 auto 18px;box-shadow:0 14px 28px rgba(36,122,114,.28)">7</div>
      <h1 style="margin:0 0 10px;font-size:26px;letter-spacing:-.04em">頁面載入中…</h1>
      <p style="margin:0 0 18px;color:#6a7c78;font-size:14px;line-height:1.6">若瀏覽器未自動跳轉，請點擊下方按鈕返回登入頁。</p>
      <a href="./#/login" style="display:inline-block;padding:13px 20px;border-radius:14px;background:#247a72;color:#fff;text-decoration:none;font-weight:800;font-size:14px;box-shadow:0 8px 16px rgba(36,122,114,.22)">返回登入頁</a>
    </div>
  </body>
</html>
