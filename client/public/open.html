    <script>
      (function () {

        function getShareCodesSync() {

        function chevronLeftIcon() { return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>'; }
        function chevronRightIcon() { return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>'; }
        function xIconSm() { return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>'; }
        function arrowDownLeft() { return '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7 7 17"/><path d="M17 17H7V7"/></svg>'; }
        function arrowUpRight() { return '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg>'; }
        function receiptIcon() { return '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1-2-1-2 1-2-1Z"/><path d="M16 8H8"/><path d="M16 12H8"/><path d="M10 16H8"/></svg>'; }
        function usersIcon() { return '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>'; }
        function renderEmpty(title, desc, icon) {
          return `<div class="empty-state">${icon || ""}<strong>${title}</strong><span>${desc}</span></div>`;
        }
        function greetingOf(h) {
          if (h >= 3 && h < 11) return "早安";
          if (h >= 11 && h < 19) return "午安";
          return "晚安";
        }
        function txImagesHTML(t, previewIndex) {
          if (!t || !Array.isArray(t.images) || !t.images.length) return { titleExtra: "", thumbRow: "" };
          const first = t.images[0];
          const rest = t.images.slice(1, 4);
          const moreN = Math.max(0, t.images.length - 4);
          const titleExtra = `<button class="tx-title-image" data-action="open-preview" data-idx="${previewIndex}" aria-label="檢視圖片" title="${t.images.length} 張附件"><img src="${first}" alt="" /></button>`;
          let thumbRow = "";
          if (t.images.length > 1) {
            const thumbs = rest.map((src, i) => `<button class="tx-thumb" data-action="open-preview" data-idx="${previewIndex}" aria-label="查看圖片"><img src="${src}" alt="" /></button>`).join("");
            const more = moreN > 0 ? `<span class="tx-thumb-more">+${moreN}</span>` : "";
            thumbRow = `<div class="tx-thumb-row">${thumbs}${more}</div>`;
          }
          return { titleExtra, thumbRow };
        }
        function render(data) {
          const root = document.getElementById("root");
          if (!data) {
            const codeHint = __SHORT_CODE_HINT__ && __SHORT_CODE_HINT__.code ? String(__SHORT_CODE_HINT__.code) : "";
            const isShortMissing = codeHint.length > 0;
            const titleText = isShortMissing ? "短連結需要由原裝置開啟" : "連結已失效或格式錯誤";
            const h3Text = isShortMissing
              ? "這個連結是 LINE 短連結版本"
              : "連結已失效或格式錯誤";
            const pText = isShortMissing
              ? `班費公開頁的短連結（代碼 ${codeHint}）只有「當初產生此連結的那支手機/電腦」才有完整資料。請直接請分享者從班費管理系統內，重新按【分享 → 複製連結】後貼上給您，或請分享者點擊「預覽頁」直接打開給您。`
              : "請由系統內重新建立分享連結後再開啟。";
            const softLabel = isShortMissing ? `${sparkles()} 此為短碼分享` : `${sparkles()} 無法讀取分享資料`;
            document.title = `${titleText} · 班費公開頁`;
            root.innerHTML = `
              <div class="public-top" style="margin-top:6px">
                <div class="brand-mark">${classLogo(26,26)}</div>
                <div class="brand-copy"><p class="eyebrow">CLASS FUND SYSTEM</p><h1>班費公開頁</h1></div>
              </div>
              <section class="welcome-card"><div><span class="soft-label">${softLabel}</span><h3>${h3Text}</h3><p style="opacity:.92">${pText}</p></div><div class="mini-orbit">${circleDollarIcon()}</div></section>
              ${renderEmpty(isShortMissing ? "短碼僅在原裝置有效" : "目前沒有可顯示的資料", isShortMissing ? "請分享者重新按【分享按鈕 → 複製連結】取得最新短連結後貼上，或請分享者改按下「預覽頁」將頁面畫面傳送給您。" : "請由系統內重新建立分享連結後再開啟。")}`;
            bindPreview([]);
            return;
          }
          const s = data.summary || {};
          const txs = Array.isArray(data.transactions) ? data.transactions : [];
          const recent = txs.slice(0, 3);
          const txRows = recent.length ? recent.map((t, idx) => {
            const cls = String(t.type) === "in" ? "in" : "out";
            const sign = String(t.type) === "in" ? "+" : "−";
            const amt = Math.abs(Number(t.amount) || 0);
            const icon = cls === "in" ? arrowDownLeft() : arrowUpRight();
            const { titleExtra, thumbRow } = txImagesHTML(t, idx);
            const titleSafe = String(t.title || "").replace(/</g, "&lt;");
            return `<div class="transaction-row" data-tx-idx="${idx}">
              <div class="tx-icon ${cls}">${icon}</div>
              <div class="tx-copy">
                <div class="tx-title-row">
                  <strong>${titleSafe}</strong>
                  ${titleExtra}
                </div>
                ${thumbRow}
              </div>
              <div class="tx-row-actions">
                <strong class="amount ${cls}">${sign}${fmt(amt)}</strong>
              </div>
            </div>`;
          }).join("") : renderEmpty("尚無資料", "請至收支頁新增第一筆收支紀錄。", receiptIcon());
          const payments = Array.isArray(data.payments) ? data.payments : [];
          let progressHTML = "";
          if (payments.length) {
            progressHTML =
              payments.map((p) => {
                const sc = Number(p.studentCount) || 0;
                const pc = Number(p.paidCount) || 0;
                const rate = sc ? Math.min(100, Math.round((pc / sc) * 100)) : 0;
                const paid = pc * (Number(p.amount) || 0);
                const unpaid = Math.max(sc - pc, 0);
                const unpaidSeats = typeof p.unpaidSeats === "string" ? p.unpaidSeats : "";
                const unpaidChip = unpaidSeats
                  ? `<p class="unpaid-seats" style="margin-top:10px;padding:10px 12px;border-radius:12px;background:#fff0ed;color:#c94d36;font-weight:700;line-height:1.65;word-break:break-word;overflow-wrap:anywhere;display:block;font-size:13px">待繳學生座號：${unpaidSeats.replace(/</g, "&lt;")}</p>`
                  : `<p class="unpaid-seats" style="background:#eaf6ee;color:#2d7a6a">✓ 全數繳清，感謝家長配合 🎉</p>`;
                const text = sc
                  ? `${sc} 位學生 · 每位 NT$ ${fmt(p.amount)}`
                  : "尚無學生資料";
                const desc = sc
                  ? `${checkIcon()} ${pc} 位已完成繳費（NT$ ${fmt(paid)}），還有 ${unpaid} 位待處理`
                  : "尚無學生資料";
                return `<div class="progress-card"><div class="progress-top"><div><strong>${String(p.title).replace(/</g, "&lt;")}</strong><span>${text}</span></div><b>${rate}%</b></div><div class="progress-bar"><i style="width:${rate}%"></i></div><p>${desc}</p>${unpaidChip}</div>`;
              }).join("");
          } else {
            progressHTML = renderEmpty("尚無繳費項目", "請至「設定 → 繳費設定」新增第一筆繳費項目。", usersIcon());
          }
          const generatedAt = data.generatedAt ? new Date(data.generatedAt).toLocaleString("zh-Hant") : "";
          const hr = new Date().getHours();
          const greeting = greetingOf(hr);
          const className = (data.className || "701 班").replace(/</g, "&lt;");
          document.title = `${className} 班費公開頁`;
          root.innerHTML = `
            <div class="public-top">
              <div class="brand-mark">${classLogo(26,26)}</div>
              <div class="brand-copy"><p class="eyebrow">CLASS FUND SYSTEM</p><h1>${className} 班費管理</h1></div>
            </div>
            <p class="eyebrow-text">${data.yearLabel || "2026 學年度"} · ${className} · <span class="tag">公開唯讀</span></p>
            <section class="welcome-card">
              <div>
                <span class="soft-label">${sparkles()} 本月摘要</span>
                <h3>${greeting}，${className}</h3>
                <p>本班班費帳務資料已同步完成。</p>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <div class="mini-orbit">${circleDollarIcon()}</div>
              </div>
            </section>
            <section class="metric-grid">
              <div class="metric-card accent"><span>目前結餘</span><strong>NT$ ${fmt(s.balance)}</strong><small>${arrowUp()} 即時資料</small></div>
              <div class="metric-card"><span>本月收入</span><strong>NT$ ${fmt(s.income)}</strong><small class="positive">${arrowUp()} ${Number(s.incomeCount || 0)} 筆收入</small></div>
              <div class="metric-card"><span>本月支出</span><strong>NT$ ${fmt(s.expense)}</strong><small class="negative">${arrowDown()} ${Number(s.expenseCount || 0)} 筆支出</small></div>
            </section>
            <div class="section-row"><h3>最近收支</h3><span class="text-link">共 ${txs.length} 筆 ${chevronRight()}</span></div>
            <div class="transaction-list">${txRows}</div>
            <div class="section-row upcoming-heading"><h3>繳費進度</h3></div>
            ${progressHTML}
            <div class="footer-note"><span>${className} 班級自治會</span><span class="status-dot"><i></i>唯讀模式${generatedAt ? " · " + generatedAt : ""}</span></div>
          `;
          bindPreview(recent);
        }
        function bindPreview(recentTxs) {
          const allButtons = document.querySelectorAll("[data-action=open-preview]");
          const body = document.body;
          const openModal = (txList, startIdx) => {
            const imgs = Array.isArray(txList.images) ? txList.images.slice() : [];
            if (!imgs.length) return;
            const title = String(txList.title || "").replace(/</g, "&lt;");
            let idx = Number(startIdx) || 0;
            idx = Math.max(0, Math.min(imgs.length - 1, idx));
            const wrap = document.createElement("div");
            wrap.className = "tx-preview-modal";
            wrap.setAttribute("role", "dialog");
            wrap.setAttribute("aria-modal", "true");
            const render = () => {
              const img = imgs[idx];
              const thumbs = imgs.map((src, i) => `<button class="${i === idx ? "active" : ""}" data-goto="${i}" aria-label="切換到第 ${i+1} 張"><img src="${src}" alt="" /></button>`).join("");
              wrap.innerHTML = `
                <div class="tx-preview" onclick="event.stopPropagation()">
                  <div class="tx-preview-head">
                    <h3>${title} · 圖片預覽</h3>
                    <div style="display:flex; align-items:center; gap:10px;">
                      <div class="tx-preview-counter">
                        <button data-act="prev" aria-label="上一張" ${idx === 0 ? "disabled" : ""}>${chevronLeftIcon()}</button>
                        <span>${idx + 1} / ${imgs.length}</span>
                        <button data-act="next" aria-label="下一張" ${idx === imgs.length - 1 ? "disabled" : ""}>${chevronRightIcon()}</button>
                      </div>
                      <button class="tx-preview-close" data-act="close" aria-label="關閉預覽">${xIconSm()}</button>
                    </div>
                  </div>
                  <div class="tx-preview-stage">
                    <button class="gallery-arrow gallery-prev" data-act="prev" aria-label="上一張" ${idx === 0 ? "disabled" : ""}>${chevronLeftIcon()}</button>
                    <img src="${img}" alt="${title} 第 ${idx+1} 張" />
                    <button class="gallery-arrow gallery-next" data-act="next" aria-label="下一張" ${idx === imgs.length - 1 ? "disabled" : ""}>${chevronRightIcon()}</button>
                  </div>
                  <div class="tx-preview-thumbs">${thumbs}</div>
                </div>
              `;
              wrap.querySelectorAll("[data-act]").forEach((btn) => {
                btn.addEventListener("click", (e) => {
                  e.stopPropagation();
                  const act = btn.getAttribute("data-act");
                  if (act === "close") close();
                  if (act === "prev" && idx > 0) { idx -= 1; render(); }
                  if (act === "next" && idx < imgs.length - 1) { idx += 1; render(); }
                });
              });
              wrap.querySelectorAll("[data-goto]").forEach((b) => {
                b.addEventListener("click", (e) => {
                  e.stopPropagation();
                  const goto = Number(b.getAttribute("data-goto"));
                  if (!isNaN(goto) && goto >= 0 && goto < imgs.length) { idx = goto; render(); }
                });
              });
            };
            const close = () => {
              if (wrap.parentNode) wrap.parentNode.removeChild(wrap);
              body.style.overflow = "";
              document.removeEventListener("keydown", onKey);
            };
            const onKey = (e) => {
              if (e.key === "Escape") close();
              if (e.key === "ArrowLeft" && idx > 0) { idx -= 1; render(); }
              if (e.key === "ArrowRight" && idx < imgs.length - 1) { idx += 1; render(); }
            };
            wrap.addEventListener("click", (e) => {
              if (e.target === wrap) close();
            });
            body.appendChild(wrap);
            body.style.overflow = "hidden";
            document.addEventListener("keydown", onKey);
            render();
          };
          allButtons.forEach((b) => {
            b.addEventListener("click", (e) => {
              e.preventDefault();
              e.stopPropagation();
              const txIdxRaw = b.closest("[data-tx-idx]")?.getAttribute("data-tx-idx");
              const txIdx = Number(txIdxRaw);
              const tx = !isNaN(txIdx) ? recentTxs[txIdx] : null;
              if (tx) openModal(tx, 0);
            });
          });
        }
        (function main() {
          var root = document.getElementById("root");
          function showLoading() {
            if (!root) return;
            root.innerHTML = `<div class="public-top" style="margin-top:6px"><div class="brand-mark">${classLogo(26,26)}</div><div class="brand-copy"><p class="eyebrow">CLASS FUND SYSTEM</p><h1>班費公開頁</h1></div></div><section class="welcome-card"><div><span class="soft-label">${sparkles()} 讀取中…</span><h3>正在載入班費資料</h3><p style="opacity:.85">連結已加密壓縮，解壓縮大約需要 1~3 秒。</p></div></section><div class="empty-state" style="margin-top:14px"><strong>解密中…</strong><span>若長時間無回應，請由系統內重新建立分享連結。</span></div>`;
          }
          showLoading();
          var timeout = setTimeout(function () {
            try {
              var emptyR = document.getElementById("root");
              if (!emptyR) return;
              if (!emptyR.innerHTML || emptyR.innerHTML.indexOf("解密中") === -1) return;
              render(null);
            } catch (_e) { render(null); }
          }, 9000);
          decodeBundle(location.search).then(function (data) {
            clearTimeout(timeout);
            render(data);
          }).catch(function () {
            clearTimeout(timeout);
            render(null);
          });
        })();
      })();
    </script>
  </body>
</html>
